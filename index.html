<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>One Dot at a Time — Jim York</title>
  <meta name="description" content="Stipple and pen-and-ink drawings by Jim York. One Dot at a Time." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #121212;
      --ink: #f2efe8;
      --muted: #a8a29a;
      --line: #2a2a2a;
      --max: 920px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-weight: 400;
      line-height: 1.55;
    }
    header {
      padding: 3.5rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      letter-spacing: 0.02em;
      margin: 0 0 0.4rem;
    }
    .byline {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 300;
      margin: 0;
    }
    .intro {
      max-width: 36rem;
      margin: 1.25rem auto 0;
      font-size: 1.05rem;
      color: var(--muted);
    }
    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    article {
      margin-bottom: 3.5rem;
    }
    article:last-child { margin-bottom: 1rem; }
    figure {
      margin: 0;
      background: #1a1a1a;
      border: 1px solid var(--line);
      padding: 0.75rem;
      box-shadow: 0 1px 0 rgba(0,0,0,0.35);
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: middle;
    }
    figcaption {
      margin-top: 1rem;
      text-align: center;
    }
    figcaption .title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.45rem;
      font-weight: 600;
      margin: 0;
    }
    figcaption .meta {
      margin: 0.35rem 0 0;
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 300;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 2rem 1.5rem 3rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    footer a:hover { border-bottom-color: var(--ink); }
    .tags {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      letter-spacing: 0.01em;
      color: #7a746c;
    }
  </style>
</head>
<body>
  <header>
    <h1>One Dot at a Time</h1>
    <p class="byline">Stipple · pen and ink · Jim York</p>
    <p class="intro">Fine drawings built one mark at a time — architecture, figure, and quiet detail.</p>
  </header>
  <main>
    <article id="michael">
      <figure>
        <img src="img/michael.jpg" alt="Archangel Michael — stipple drawing by Jim York" width="1600" height="2337" loading="eager" />
        <figcaption>
          <p class="title">No. 01 — Archangel Michael</p>
          <p class="meta">Stipple / pen and ink</p>
        </figcaption>
      </figure>
    </article>
    <article id="through-the-frames">
      <figure>
        <img src="img/through-the-frames.jpg" alt="Through the Frames — stipple drawing by Jim York" width="1520" height="1172" loading="lazy" />
        <figcaption>
          <p class="title">No. 02 — Through the Frames</p>
          <p class="meta">Stipple / pen and ink</p>
        </figcaption>
      </figure>
    </article>
    <article id="capitol">
      <figure>
        <img src="img/capitol.jpg" alt="Capitol — stipple drawing by Jim York" width="1600" height="1277" loading="lazy" />
        <figcaption>
          <p class="title">No. 03 — Capitol</p>
          <p class="meta">Stipple / pen and ink</p>
        </figcaption>
      </figure>
    </article>
  </main>
  <footer>
    <p>
      <a href="https://www.instagram.com/one_dot_atatime/">Instagram</a>
      ·
      <a href="https://x.com/one_dot_atatime">X</a>
      ·
      <a href="https://www.facebook.com/onedotatatime.art">Facebook</a>
      ·
      <a href="https://www.xibit360.art/@onedotatatime">3D gallery</a>
    </p>
    <p class="tags">#onedotatatime #stippling #stippleart #dotwork #penandink</p>
    <p>© Jim York · Tempe, AZ</p>
  </footer>
</body>
</html>
